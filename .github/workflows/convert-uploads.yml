# Uploads in formats browsers can't show (JPEG 2000, TIFF, PDF) are converted
# to JPG or SVG and committed back; see scripts/convert_uploads.py. The commit then
# triggers the normal site deploy.
name: Convert uploads

on:
  push:
    branches: [main]
    paths:
      - "src/assets/uploads/**"
      - "src/projects/**"

permissions:
  contents: write

concurrency:
  group: convert-uploads
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow pymupdf

      - run: python scripts/convert_uploads.py

      - name: Commit converted files
        run: |
          git add -A src/assets/uploads src/assets/zoom src/assets/pdf src/_data/pdf.json src/projects originals
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898733+github-actions[bot]@users.noreply.github.com"
          git commit -m "Convert uploads to JPG so browsers can show them"
          # The CMS may have pushed again meanwhile.
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
