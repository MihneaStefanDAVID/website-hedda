# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: MihneaStefanDAVID/website-hedda
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/b7fb301c-778a-4e0f-9ac8-71af1175165e/pkce
  auth_token_endpoint: /sites/b7fb301c-778a-4e0f-9ac8-71af1175165e/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Enable PKCE fields (optional, recommended)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Add site links in Decap CMS (optional)
site_url: https://heddaoprea.com

# When the admin is opened from localhost, Decap automatically talks to
# a local proxy server instead of the backend above — run `npm run
# cms:local` (decap-server) alongside `npm start` to edit content
# locally without touching DecapBridge/production at all.
local_backend: true


# media_folder is relative to the repo root by default in Decap — it must
# point inside src/ so Eleventy's passthrough copy of src/assets actually
# ships uploaded files. public_folder is the URL path they're served at,
# which still resolves correctly since src/assets -> /assets at build time.
media_folder: "src/assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "projects"
    label: "Projects"
    folder: "src/projects"
    create: true
    slug: "{{slug}}"
    identifier_field: "title"
    sortable_fields: ["order", "title"]
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - label: "Order"
        name: "order"
        widget: "number"
        value_type: "int"
        default: 0
        hint: "Controls left-to-right / grid position on the main page. Lower numbers come first — the first 4 become the animated hero cards."
      - { label: "Cover Image", name: "cover", widget: "image" }
      - label: "Supervision"
        name: "supervision"
        widget: "string"
        required: false
        hint: "Shown at the top of the project page and in the box that appears when hovering the project on the main page."
      - label: "Semester"
        name: "semester"
        widget: "string"
        required: false
        hint: "e.g. FS26. Shown at the top of the project page and in the hover box on the main page."
      - label: "Text (English)"
        name: "body"
        widget: "rich_editor"
        hint: "The project text, shown in the left column of the project page. English is what visitors see by default. Photos go in Photo rows below."
      - label: "Text (German)"
        name: "body_de"
        widget: "rich_editor"
        required: false
        hint: "The same text in German, shown when a visitor switches the project page to DE. If left empty, the English text is shown instead."
      - label: "Photo rows"
        name: "gallery"
        widget: "list"
        label_singular: "row"
        required: false
        collapsed: false
        hint: "The right column of the project page, top to bottom. Each row holds 1 to 4 photos, GIFs or videos shown side by side at the same height. Drag rows, or items within a row, to reorder. Visitors can click any of them to see it enlarged."
        fields:
          - label: "Photos / videos in this row"
            name: "photos"
            widget: "list"
            label_singular: "photo or video"
            min: 1
            max: 4
            collapsed: false
            hint: "Photos (JPG, PNG), GIFs or videos (MP4). Videos play silently on a loop, like a GIF — keep them short and compressed (ideally under 20 MB)."
            field: { label: "Photo or video", name: "image", widget: "file" }
          - label: "Row size"
            name: "size"
            widget: "select"
            required: false
            default: "full"
            options:
              - { label: "Full width", value: "full" }
              - { label: "Large (3/4)", value: "large" }
              - { label: "Medium (1/2)", value: "medium" }
              - { label: "Small (1/3)", value: "small" }
            hint: "How much of the right column this row takes up."
          - label: "Row alignment"
            name: "align"
            widget: "select"
            required: false
            default: "center"
            options:
              - { label: "Left", value: "left" }
              - { label: "Center", value: "center" }
              - { label: "Right", value: "right" }
            hint: "Where a row smaller than full width sits."
