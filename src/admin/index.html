<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Hedda Oprea — Admin</title>
    <style>
      /* Scoped styling for the custom rich-text editor widget only — this
         is admin tooling chrome, separate from the public site's
         styles.css (which the TinyMCE iframe also loads directly, via
         content_css below, so editing looks like the real page). */
      .rt-root {
        border: 1px solid #dedede;
        border-radius: 4px;
      }

      /* Shown while a video is compressed, above Decap's media library. */
      .video-job {
        position: fixed;
        inset: 0;
        z-index: 1000000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(23, 23, 23, 0.6);
        font: 15px/1.4 "Helvetica Neue", Helvetica, Arial, sans-serif;
      }
      .video-job__box {
        width: min(420px, calc(100vw - 32px));
        box-sizing: border-box;
        padding: 24px;
        background: #fff;
        border-radius: 4px;
      }
      .video-job__box p {
        margin: 0 0 16px;
      }
      .video-job__box progress {
        display: block;
        width: 100%;
        margin-bottom: 16px;
      }
    </style>
  </head>
  <body>
    <script src="https://cdn.jsdelivr.net/npm/tinymce@7/tinymce.min.js"></script>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      // ------------------------------------------------------------------
      // Custom "rich_editor" widget — a Word-like editor for a project's
      // text (the left column of the project page): headings, bold,
      // italic, lists, links. Photos are a separate list field (right
      // column), so this editor deliberately has no image or table tools.
      // Backed by TinyMCE (self-hosted, license_key: "gpl" — free, no
      // account, no build step, matching how Decap CMS is loaded above).
      // Stores raw HTML.
      // ------------------------------------------------------------------
      // The site's stylesheet, loaded by both the editor and the preview.
      // The host caches styles.css for hours and this admin page is a
      // static file (no build-time hash like the site's pages get), so
      // without a fresh URL each time the preview could keep showing an
      // old layout after a design change.
      var SITE_CSS = "/styles.css?v=" + Date.now();

      var RichEditorControl = createClass({
        componentDidMount: function () {
          var self = this;
          tinymce.init({
            target: this._textareaEl,
            license_key: "gpl",
            height: 420,
            menubar: false,
            branding: false,
            plugins: "lists link",
            toolbar: "undo redo | blocks | bold italic | bullist numlist | link removeformat",
            block_formats: "Paragraph=p; Heading=h2; Subheading=h3",
            content_css: SITE_CSS,
            body_class: "project-content",
            // Keep link URLs exactly as typed — TinyMCE would otherwise
            // rewrite site-absolute paths relative to this admin page.
            relative_urls: false,
            convert_urls: false,
            remove_script_host: false,
            setup: function (editor) {
              self._editor = editor;
              editor.on("init", function () {
                editor.setContent(self.props.value || "");
              });
              editor.on("change input undo redo", function () {
                self.props.onChange(editor.getContent());
              });
            },
          });
        },

        componentDidUpdate: function (prevProps) {
          // Decap's SPA routing can reuse this same widget instance when
          // navigating from one entry to another (not a full page reload),
          // so value can change for a reason other than our own typing.
          // Only push it into the editor if it's genuinely different from
          // what's already there — our own onChange echoes value right
          // back unchanged, and calling setContent then would reset the
          // cursor to the start on every keystroke.
          if (this._editor && this.props.value !== prevProps.value) {
            var current = this._editor.getContent();
            if (this.props.value !== current) {
              this._editor.setContent(this.props.value || "");
            }
          }
        },

        componentWillUnmount: function () {
          if (this._editor) {
            tinymce.remove(this._editor);
          }
        },

        render: function () {
          var self = this;
          return h(
            "div",
            { className: "rt-root" },
            h("textarea", {
              ref: function (el) {
                self._textareaEl = el;
              },
              defaultValue: this.props.value || "",
            })
          );
        },
      });

      CMS.registerWidget("rich_editor", RichEditorControl);

      // ------------------------------------------------------------------
      // Uploads are checked here, the moment a file is chosen, because
      // Decap only sends them on Publish and then fails the whole entry
      // with an unhelpful error. Three limits decide what reaches the site:
      // - a request through the CMS gateway can't pass 100 MB (Cloudflare),
      //   and files travel as base64, a third larger: about 70 MB of file;
      // - the host refuses files of 25 MB or more, so the build leaves them
      //   out (.eleventy.js). Photos have smaller web versions, but videos
      //   and GIFs don't and would simply be missing from the page;
      // - not every browser plays every video, e.g. iPhone .mov (HEVC).
      // So a video is compressed in the browser into an MP4 that fits and
      // plays everywhere, and Decap receives that file instead.
      // ------------------------------------------------------------------
      var MB = 1024 * 1024;
      var UPLOAD_LIMIT = 70 * MB;
      var HOST_LIMIT = 25 * MB;
      var VIDEO_TARGET = 20 * MB;
      var VIDEO_BITRATE = 6e6; // the most a video gets, in bits per second
      var AUDIO_BITRATE = 128e3;
      var MIN_BITRATE = 25e4; // below this a video is too blurry to show
      var VIDEO_LIBRARY = "https://cdn.jsdelivr.net/npm/mediabunny@1.61.6/dist/bundles/mediabunny.min.mjs";

      var showVideoJob = function (onCancel) {
        var job = document.createElement("div");
        job.className = "video-job";
        job.innerHTML =
          '<div class="video-job__box" role="status"><p>Compressing video for the website… Keep this tab open.</p>' +
          '<progress max="1"></progress><button type="button">Cancel</button></div>';
        job.querySelector("button").addEventListener("click", onCancel);
        document.body.appendChild(job);
        return job;
      };

      // Longest side for a bitrate: a low one looks better on fewer pixels.
      var longSideFor = function (bitrate) {
        return bitrate >= 2e6 ? 1920 : bitrate >= 8e5 ? 1280 : 854;
      };

      var convertVideo = async function (lib, file, bitrate, job) {
        var input = new lib.Input({ source: new lib.BlobSource(file), formats: lib.ALL_FORMATS });
        var output = new lib.Output({
          format: new lib.Mp4OutputFormat({ fastStart: "in-memory" }),
          target: new lib.BufferTarget(),
        });
        var track = await input.getPrimaryVideoTrack();
        var side = longSideFor(bitrate);
        var video = { codec: "avc", bitrate: Math.round(bitrate), forceTranscode: true };
        if (track.displayWidth >= track.displayHeight) {
          video.width = Math.min(track.displayWidth, side);
        } else {
          video.height = Math.min(track.displayHeight, side);
        }
        var conversion = await lib.Conversion.init({
          input: input,
          output: output,
          video: video,
          audio: { codec: "aac", bitrate: AUDIO_BITRATE },
          showWarnings: false,
        });
        if (!conversion.isValid) {
          throw new Error("This browser can't read this video. Try Chrome, or export it as an MP4 (H.264) first.");
        }
        conversion.onProgress = function (progress) {
          job.progress.value = progress;
        };
        job.conversion = conversion;
        await conversion.execute();
        return output.target.buffer;
      };

      var compressVideo = async function (file, job) {
        var lib = await import(VIDEO_LIBRARY);
        var input = new lib.Input({ source: new lib.BlobSource(file), formats: lib.ALL_FORMATS });
        var track = await input.getPrimaryVideoTrack();
        if (!track) throw new Error("This file has no video in it.");
        var isMp4 = (await input.getFormat()) === lib.MP4;
        if (isMp4 && (await track.getCodec()) === "avc" && file.size <= VIDEO_TARGET) return file;
        var audio = await input.getPrimaryAudioTrack();
        var seconds = await input.computeDuration();
        var budget = (VIDEO_TARGET * 8) / seconds - (audio ? AUDIO_BITRATE : 0);
        if (budget < MIN_BITRATE) {
          throw new Error("This video is too long to fit on the website (" + Math.round(seconds / 60) + " min). Shorten it to about 8 minutes or less.");
        }
        var bitrate = Math.min(budget, VIDEO_BITRATE);
        // Encoders only aim for a bitrate; aim lower if one overshot.
        for (var attempt = 0; attempt < 3; attempt++) {
          job.progress.removeAttribute("value");
          var buffer = await convertVideo(lib, file, bitrate, job);
          if (buffer.byteLength < HOST_LIMIT) {
            var name = file.name.replace(/\.[^.]+$/, "") + ".mp4";
            return new File([buffer], name, { type: "video/mp4" });
          }
          bitrate *= (VIDEO_TARGET / buffer.byteLength) * 0.9;
        }
        throw new Error("This video could not be compressed enough. Shorten it and try again.");
      };

      var handleVideo = async function (input, file) {
        var job = { canceled: false };
        job.element = showVideoJob(function () {
          job.canceled = true;
          if (job.conversion) job.conversion.cancel();
        });
        job.progress = job.element.querySelector("progress");
        var result = null;
        try {
          result = await compressVideo(file, job);
        } catch (error) {
          if (!job.canceled) window.alert(error.message || "This video could not be compressed.");
        }
        job.element.remove();
        if (!result) {
          input.value = "";
          return;
        }
        var files = new DataTransfer();
        files.items.add(result);
        input.files = files.files;
        input.dataset.ready = "true";
        input.dispatchEvent(new Event("change", { bubbles: true }));
      };

      // Runs before Decap's own handler, which only gets the file once
      // this has let it through.
      window.addEventListener(
        "change",
        function (event) {
          var input = event.target;
          if (input.type !== "file" || !input.files.length) return;
          if (input.dataset.ready) {
            delete input.dataset.ready;
            return;
          }
          var file = input.files[0];
          var refuse = function (message) {
            event.stopImmediatePropagation();
            input.value = "";
            window.alert(message);
          };
          if (/^video\//.test(file.type) || /\.(mp4|m4v|mov|webm|mkv)$/i.test(file.name)) {
            event.stopImmediatePropagation();
            handleVideo(input, file);
          } else if (/\.gif$/i.test(file.name) && file.size >= HOST_LIMIT) {
            refuse("This GIF is too large for the website (25 MB or more). Export it as an MP4 instead: videos are compressed automatically.");
          } else if (file.size > UPLOAD_LIMIT) {
            refuse("This file is too large to upload (over 70 MB). Export a smaller version first.");
          }
        },
        true
      );

      // ------------------------------------------------------------------
      // Live preview for the Projects collection — mirrors
      // src/_includes/project.njk: facts table and text on the left,
      // rows of side-by-side photos on the right, inside the site's
      // real header.
      // ------------------------------------------------------------------
      CMS.registerPreviewStyle(SITE_CSS);

      var ProjectPreview = createClass({
        render: function () {
          var props = this.props;
          var entry = props.entry;
          var title = entry.getIn(["data", "title"]) || "";
          var supervision = entry.getIn(["data", "supervision"]) || "";
          var semester = entry.getIn(["data", "semester"]) || "";
          var contentHtml = entry.getIn(["data", "body"]) || "";
          var contentHtmlDe = entry.getIn(["data", "body_de"]) || "";
          var gallery = entry.getIn(["data", "gallery"]);
          gallery = gallery && gallery.toJS ? gallery.toJS() : gallery || [];
          // Files added but not published yet aren't at their final URL,
          // and getAsset still returns it; the entry holds a temporary one.
          var mediaFiles = entry.get("mediaFiles");
          mediaFiles = mediaFiles && mediaFiles.toJS ? mediaFiles.toJS() : mediaFiles || [];

          var facts = [["Project", h("h1", { className: "project-facts__title" }, title)]];
          if (supervision) facts.push(["Supervision", supervision]);
          if (semester) facts.push(["Semester", semester]);

          return h(
            "div",
            {},
            h(
              "header",
              {
                className: "site-header",
                style: { position: "static" },
              },
              h("span", { className: "site-name" }, "hedda oprea"),
              h("span", { className: "contact-link" }, "contact")
            ),
            h(
              "main",
              { className: "project-main", style: { paddingTop: "24px" } },
              h(
                "div",
                { className: "project-layout" },
                h(
                  "div",
                  { className: "project-text" },
                  h(
                    "div",
                    { className: "project-topbar" },
                    h("span", { className: "project-header__back" }, "go back"),
                    h("span", { className: "lang-switch" }, "EN / DE")
                  ),
                  h(
                    "table",
                    { className: "project-facts" },
                    h("thead", {}, h("tr", {}, facts.map(function (f, i) {
                      return h("th", { key: i }, f[0]);
                    }))),
                    h("tbody", {}, h("tr", {}, facts.map(function (f, i) {
                      return h("td", { key: i }, f[1]);
                    })))
                  ),
                  h("div", {
                    className: "project-content",
                    dangerouslySetInnerHTML: { __html: contentHtml },
                  }),
                  // The site shows one language at a time (EN/DE switch);
                  // the preview shows both so each can be checked.
                  contentHtmlDe &&
                    h(
                      "div",
                      { style: { marginTop: "2em", paddingTop: "1em", borderTop: "1px solid #dedede" } },
                      h("p", { style: { fontSize: "0.75rem", opacity: 0.5, margin: "0 0 1em" } }, "DE"),
                      h("div", {
                        className: "project-content",
                        dangerouslySetInnerHTML: { __html: contentHtmlDe },
                      })
                    )
                ),
                h(
                  "div",
                  { className: "project-gallery" },
                  gallery.map(function (row, r) {
                    var items = ((row && row.photos) || []).filter(Boolean);
                    var rowClass =
                      "project-gallery__row project-gallery__row--" + ((row && row.size) || "full") +
                      " project-gallery__row--align-" + ((row && row.align) || "center");
                    return h(
                      "div",
                      { className: rowClass, key: r },
                      items.map(function (path, i) {
                        var asset = props.getAsset(path);
                        var unpublished = mediaFiles.find(function (file) {
                          return file.draft && file.name === path.split("/").pop();
                        });
                        var src = unpublished ? unpublished.url : asset ? asset.toString() : path;
                        // Same equal-height rule as script.js on the site.
                        var fit = function (event) {
                          var el = event.target;
                          var w = el.videoWidth || el.naturalWidth;
                          var ht = el.videoHeight || el.naturalHeight;
                          if (w && ht) el.parentNode.style.flexGrow = String((w / ht) * 100);
                        };
                        var media = /\.(mp4|webm|mov|m4v)$/i.test(path)
                          ? h("video", { src: src, autoPlay: true, muted: true, loop: true, playsInline: true, onLoadedMetadata: fit })
                          : h("img", { src: src, alt: "", onLoad: fit });
                        return h("span", { className: "project-gallery__item", key: i }, media);
                      })
                    );
                  })
                )
              )
            )
          );
        },
      });

      CMS.registerPreviewTemplate("projects", ProjectPreview);
    </script>
  </body>
</html>
