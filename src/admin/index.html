<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Hedda Oprea — Admin</title>
    <style>
      /* Scoped styling for the custom rich-text editor widget only — this
         is admin tooling chrome, separate from the public site's
         styles.css (which the TinyMCE iframe also loads directly, via
         content_css below, so editing looks like the real page). */
      .rt-root {
        border: 1px solid #dedede;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <script src="https://cdn.jsdelivr.net/npm/tinymce@7/tinymce.min.js"></script>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      // ------------------------------------------------------------------
      // Custom "rich_editor" widget — a Word-like editor for a project's
      // text (the left column of the project page): headings, bold,
      // italic, lists, links. Photos are a separate list field (right
      // column), so this editor deliberately has no image or table tools.
      // Backed by TinyMCE (self-hosted, license_key: "gpl" — free, no
      // account, no build step, matching how Decap CMS is loaded above).
      // Stores raw HTML.
      // ------------------------------------------------------------------
      // The site's stylesheet, loaded by both the editor and the preview.
      // The host caches styles.css for hours and this admin page is a
      // static file (no build-time hash like the site's pages get), so
      // without a fresh URL each time the preview could keep showing an
      // old layout after a design change.
      var SITE_CSS = "/styles.css?v=" + Date.now();

      var RichEditorControl = createClass({
        componentDidMount: function () {
          var self = this;
          tinymce.init({
            target: this._textareaEl,
            license_key: "gpl",
            height: 420,
            menubar: false,
            branding: false,
            plugins: "lists link",
            toolbar: "undo redo | blocks | bold italic | bullist numlist | link removeformat",
            block_formats: "Paragraph=p; Heading=h2; Subheading=h3",
            content_css: SITE_CSS,
            body_class: "project-content",
            // Keep link URLs exactly as typed — TinyMCE would otherwise
            // rewrite site-absolute paths relative to this admin page.
            relative_urls: false,
            convert_urls: false,
            remove_script_host: false,
            setup: function (editor) {
              self._editor = editor;
              editor.on("init", function () {
                editor.setContent(self.props.value || "");
              });
              editor.on("change input undo redo", function () {
                self.props.onChange(editor.getContent());
              });
            },
          });
        },

        componentDidUpdate: function (prevProps) {
          // Decap's SPA routing can reuse this same widget instance when
          // navigating from one entry to another (not a full page reload),
          // so value can change for a reason other than our own typing.
          // Only push it into the editor if it's genuinely different from
          // what's already there — our own onChange echoes value right
          // back unchanged, and calling setContent then would reset the
          // cursor to the start on every keystroke.
          if (this._editor && this.props.value !== prevProps.value) {
            var current = this._editor.getContent();
            if (this.props.value !== current) {
              this._editor.setContent(this.props.value || "");
            }
          }
        },

        componentWillUnmount: function () {
          if (this._editor) {
            tinymce.remove(this._editor);
          }
        },

        render: function () {
          var self = this;
          return h(
            "div",
            { className: "rt-root" },
            h("textarea", {
              ref: function (el) {
                self._textareaEl = el;
              },
              defaultValue: this.props.value || "",
            })
          );
        },
      });

      CMS.registerWidget("rich_editor", RichEditorControl);

      // ------------------------------------------------------------------
      // Live preview for the Projects collection — mirrors
      // src/_includes/project.njk: facts table and text on the left,
      // rows of side-by-side photos on the right, inside the site's
      // real header.
      // ------------------------------------------------------------------
      CMS.registerPreviewStyle(SITE_CSS);

      var ProjectPreview = createClass({
        render: function () {
          var props = this.props;
          var entry = props.entry;
          var title = entry.getIn(["data", "title"]) || "";
          var supervision = entry.getIn(["data", "supervision"]) || "";
          var semester = entry.getIn(["data", "semester"]) || "";
          var contentHtml = entry.getIn(["data", "body"]) || "";
          var contentHtmlDe = entry.getIn(["data", "body_de"]) || "";
          var gallery = entry.getIn(["data", "gallery"]);
          gallery = gallery && gallery.toJS ? gallery.toJS() : gallery || [];

          var facts = [["Project", h("h1", { className: "project-facts__title" }, title)]];
          if (supervision) facts.push(["Supervision", supervision]);
          if (semester) facts.push(["Semester", semester]);

          return h(
            "div",
            {},
            h(
              "header",
              {
                className: "site-header",
                style: { position: "static" },
              },
              h("span", { className: "site-name" }, "hedda oprea"),
              h("span", { className: "contact-link" }, "contact")
            ),
            h(
              "main",
              { className: "project-main", style: { paddingTop: "24px" } },
              h(
                "div",
                { className: "project-layout" },
                h(
                  "div",
                  { className: "project-text" },
                  h(
                    "div",
                    { className: "project-topbar" },
                    h("span", { className: "project-header__back" }, "go back"),
                    h("span", { className: "lang-switch" }, "EN / DE")
                  ),
                  h(
                    "table",
                    { className: "project-facts" },
                    h("thead", {}, h("tr", {}, facts.map(function (f, i) {
                      return h("th", { key: i }, f[0]);
                    }))),
                    h("tbody", {}, h("tr", {}, facts.map(function (f, i) {
                      return h("td", { key: i }, f[1]);
                    })))
                  ),
                  h("div", {
                    className: "project-content",
                    dangerouslySetInnerHTML: { __html: contentHtml },
                  }),
                  // The site shows one language at a time (EN/DE switch);
                  // the preview shows both so each can be checked.
                  contentHtmlDe &&
                    h(
                      "div",
                      { style: { marginTop: "2em", paddingTop: "1em", borderTop: "1px solid #dedede" } },
                      h("p", { style: { fontSize: "0.75rem", opacity: 0.5, margin: "0 0 1em" } }, "DE"),
                      h("div", {
                        className: "project-content",
                        dangerouslySetInnerHTML: { __html: contentHtmlDe },
                      })
                    )
                ),
                h(
                  "div",
                  { className: "project-gallery" },
                  gallery.map(function (row, r) {
                    var items = ((row && row.photos) || []).filter(Boolean);
                    var rowClass =
                      "project-gallery__row project-gallery__row--" + ((row && row.size) || "full") +
                      " project-gallery__row--align-" + ((row && row.align) || "center");
                    return h(
                      "div",
                      { className: rowClass, key: r },
                      items.map(function (path, i) {
                        var asset = props.getAsset(path);
                        var src = asset ? asset.toString() : path;
                        // Same equal-height rule as script.js on the site.
                        var fit = function (event) {
                          var el = event.target;
                          var w = el.videoWidth || el.naturalWidth;
                          var ht = el.videoHeight || el.naturalHeight;
                          if (w && ht) el.parentNode.style.flexGrow = String((w / ht) * 100);
                        };
                        var media = /\.(mp4|webm|mov|m4v)$/i.test(path)
                          ? h("video", { src: src, autoPlay: true, muted: true, loop: true, playsInline: true, onLoadedMetadata: fit })
                          : h("img", { src: src, alt: "", onLoad: fit });
                        return h("span", { className: "project-gallery__item", key: i }, media);
                      })
                    );
                  })
                )
              )
            )
          );
        },
      });

      CMS.registerPreviewTemplate("projects", ProjectPreview);
    </script>
  </body>
</html>
